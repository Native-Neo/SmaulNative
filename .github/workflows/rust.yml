name: Rust SmaulNative

on:
  push:
    branches: [Development/Unstable]
  pull_request:
    branches: [Stable, Development/Unstable]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: cargo test --all-targets
