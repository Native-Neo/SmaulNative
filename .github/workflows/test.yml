name: Python SmaulNative

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python tests (torch fallback)
        run: pytest -q

  test-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify native extensions
        env:
          SMAULNATIVE_REQUIRE_NATIVE_RQT: "1"
        run: |
          python -c "
          import os
          from compute import get_backend
          be = get_backend(); be.configure()
          print('native fp8:', be.has_native, '| native attn:', be.has_attn_native)
          if os.environ.get('SMAULNATIVE_REQUIRE_NATIVE_RQT') == '1' and not (be.has_native and be.has_attn_native):
              raise SystemExit('SMAULNATIVE_REQUIRE_NATIVE_RQT=1 but a native extension failed to load')
          "

      - name: Run Python tests (native)
        env:
          SMAULNATIVE_REQUIRE_NATIVE_RQT: "1"
        run: pytest -q
